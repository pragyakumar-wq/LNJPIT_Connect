<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Page Not Found • LNJPIT Timetable</title>
  <meta name="theme-color" content="#1e40af">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.12);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: rgba(37, 99, 235, 0.12);
      color: var(--primary);
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 800;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.95rem;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 12px;
      background: var(--primary);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    a.btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">404</div>
    <h1>Page Not Found</h1>
    <p>Looks like this classroom or link doesn't exist. Head back to the LNJPIT 1st Semester Timetable to check your live schedule.</p>
    <a class="btn" href="./">← Back to Timetable</a>
  </main>
</body>
</html>
